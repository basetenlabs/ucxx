# Fork-local PR CI. The inherited RAPIDS workflows in this directory rely on
# rapidsai shared workflows and self-hosted GPU runners, so this fork runs
# pre-commit (the same style/lint suite as upstream's `ci/check_style.sh`)
# on GitHub-hosted runners instead.
name: baseten-pr-ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RAPIDS_CMAKE_FORMAT_FILE: /tmp/rapids_cmake_ci/cmake-format-rapids-cmake.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Fetch rapids-cmake cmake-format config
        run: |
          mkdir -p "$(dirname "${RAPIDS_CMAKE_FORMAT_FILE}")"
          wget -O "${RAPIDS_CMAKE_FORMAT_FILE}" \
            "https://raw.githubusercontent.com/rapidsai/rapids-cmake/$(cat RAPIDS_BRANCH)/cmake-format-rapids-cmake.json"
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
